# render.yaml — Mera Wakeel AI
# Frontend (React + Vite) + Backend (Express) DONO ek hi service mein:
# Express build ke baad dist/ ka frontend serve karta hai + /api/* routes chalata hai.
# Baaki sab env vars (Supabase, Gemini, Groq, Twilio, Admin key) DASHBOARD > Environment mein add karo.

services:
  - type: web
    name: mera-wakeel-ai
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
